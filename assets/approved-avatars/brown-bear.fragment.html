/* Se conservan intactos el SVG de Bruno, sus proporciones, emociones y acciones. */

/* BRUNO V33 — El paisaje dentro del escenario cubre sus cuatro lados
   a cualquier proporción de pantalla. SVG con meet producía bandas
   sin paisaje en los laterales en tabletas y ciertos tamaños. Con slice
   se expande el dibujo sin deformar a Bruno ni tocar sus animaciones. */
.stage{background-color:#aed080;overflow:hidden}
.stage > #stage-svg{display:block;width:100%;height:100%}

/* ================================================================
   SOMBRAS PROPORCIONALES Y ANIMADAS — VERSION NUEVA
   Separadas del cuerpo: permanecen en el suelo al saltar.
   La sombra lateral sigue el desplazamiento real, sin levitar.
   ================================================================ */
#shadow, #side-shadow {
  transform-box: view-box;
  filter: blur(2.6px);
  transform-origin: 352px 559px;
  animation: ground-idle-realistic 4.2s ease-in-out infinite;
}
#side-shadow-track {
  display: none;
  transform: translateX(0px);
  transition: transform 2.45s linear;
  pointer-events: none;
}
#stage-svg[data-view="perfil"] #side-shadow-track,
#stage-svg[data-view="derecha"] #side-shadow-track { display:block; }
#stage-svg.shadow-walking #shadow {
  animation: ground-step-front .98s ease-in-out infinite;
}
#stage-svg.shadow-walking #side-shadow {
  animation: ground-step-side 1s ease-in-out infinite;
}
#stage-svg.shadow-jumping #shadow,
#stage-svg.shadow-jumping #side-shadow {
  animation: ground-jump-realistic .75s ease-in-out 3 both;
}
#stage-svg.shadow-dancing #shadow,
#stage-svg.shadow-dancing #side-shadow {
  animation: ground-dance-realistic .45s ease-in-out infinite alternate;
}
@keyframes ground-idle-realistic {
  0%, 100% { transform: scale(1); opacity: .32; }
  50% { transform: scale(.97); opacity: .29; }
}
/* Alternancia de apoyos: variaciones discretas en eje y anchura. */
@keyframes ground-step-front {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-7px) scale(.91,.92); opacity: .30; }
  75% { transform: translateX(7px) scale(.91,.92); opacity: .30; }
}
@keyframes ground-step-side {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-6px) scale(.90,.94); opacity: .29; }
  75% { transform: translateX(6px) scale(.90,.94); opacity: .29; }
}
/* El personaje sube, pero su sombra no: se contrae y pierde intensidad. */
@keyframes ground-jump-realistic {
  0%,100% { transform: scale(1); opacity: .36; }
  42%,58% { transform: scale(.57,.76); opacity: .15; }
}
@keyframes ground-dance-realistic {
  from { transform: translateX(-5px) scale(1); opacity:.34; }
  to { transform: translateX(5px) scale(.91,.89); opacity:.26; }
}
@media(prefers-reduced-motion:reduce) {
  #shadow,#side-shadow {animation:none !important;transform:none !important;opacity:.32 !important;}
  #side-shadow-track {transition:none !important;}
}


/* VERSIÓN SIGUIENTE — SOMBRAS DE CONTACTO EXACTAS, SIN PIES FLOTANTES.
   La sombra amplia permanece SOBRE EL SUELO y se separa al saltar;
   los pequeños contactos se encuentran justo bajo las plantas de los pies. */
#shadow, #side-shadow { filter:blur(1.7px); }
#ground-front-contacts, #ground-side-contacts{pointer-events:none;opacity:.92}
#ground-front-contacts ellipse, #ground-side-contacts ellipse{filter:blur(1.1px)}
#ground-front-contacts{display:block}

#stage-svg[data-view="derecha"] #ground-front-contacts{display:none}
#ground-front-contacts .contact-left, #ground-side-contacts .contact-left,
#ground-front-contacts .contact-right, #ground-side-contacts .contact-right {
 transform-box:view-box;
 transform-origin:center;
}
#stage-svg.shadow-walking #ground-front-contacts .contact-left,
#stage-svg.shadow-walking #ground-side-contacts .contact-left {animation:contact-step-left .98s ease-in-out infinite}
#stage-svg.shadow-walking #ground-front-contacts .contact-right,
#stage-svg.shadow-walking #ground-side-contacts .contact-right {animation:contact-step-right .98s ease-in-out infinite}
#stage-svg.shadow-jumping #ground-front-contacts,
#stage-svg.shadow-jumping #ground-side-contacts {animation:contact-lift .75s ease-in-out 3 both}
#stage-svg.shadow-dancing #ground-front-contacts,
#stage-svg.shadow-dancing #ground-side-contacts {animation:contact-dance .45s ease-in-out infinite alternate}
@keyframes contact-step-left {0%,100%{transform:translate(0,0);opacity:1}25%{transform:translate(-5px,0);opacity:.22}50%{transform:translate(0,0);opacity:.75}75%{transform:translate(5px,0);opacity:1}}
@keyframes contact-step-right {0%,100%{transform:translate(0,0);opacity:.75}25%{transform:translate(5px,0);opacity:1}50%{transform:translate(0,0);opacity:1}75%{transform:translate(-5px,0);opacity:.22}}
@keyframes contact-lift {0%,100%{opacity:.92}18%{opacity:.1}42%,58%{opacity:0}82%{opacity:.2}}
@keyframes contact-dance {from{opacity:.85}to{opacity:.45}}

/* Bruno_Pardo V37 - rubor de timidez poligonal, frontal y lateral. */
#avatar #blush, #avatar #shy-profile-blush {opacity:0; transition:opacity .32s ease-in-out;pointer-events:none;}
#avatar[data-mood="avergonzado"] #blush, #avatar[data-mood="avergonzado"] #shy-profile-blush {opacity:.64;}

/* Símbolos limpios para enamorado/emocionado en TODOS los personajes. */
#avatar #heart-eyes > path:nth-of-type(n+3),
#avatar #star-eyes > path:nth-of-type(n+3){display:none!important}
#avatar[data-mood="enamorado"] #eye-pupils,
#avatar[data-mood="emocionado"] #eye-pupils{opacity:0!important}

#avatar[data-mood="curioso"] #brows-curious {opacity:1!important}
#avatar[data-mood="curioso"] #brows-curious path {stroke-width:5!important;stroke-linecap:round!important;fill:none!important}

/* === BOCA EMOCIONAL AL HABLAR: tristeza y enojo (sin alterar otras emociones) === */
#avatar #mouth-speak-sad, #avatar #mouth-speak-angry {display:none; pointer-events:none}
