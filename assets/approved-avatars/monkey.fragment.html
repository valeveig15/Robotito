/* ================================================================
   SOMBRAS PROPORCIONALES Y ANIMADAS — VERSION NUEVA
   Separadas del cuerpo: permanecen en el suelo al saltar.
   La sombra lateral sigue el desplazamiento real, sin levitar.
   ================================================================ */
#shadow, #side-shadow {
  transform-box: view-box;
  filter: blur(2.6px);
  transform-origin: 352px 559px;
  animation: ground-idle-realistic 4.2s ease-in-out infinite;
}
#side-shadow-track {
  display: none;
  transform: translateX(0px);
  transition: transform 2.45s linear;
  pointer-events: none;
}
#stage-svg[data-view="perfil"] #side-shadow-track,
#stage-svg[data-view="derecha"] #side-shadow-track { display:block; }
#stage-svg.shadow-walking #shadow {
  animation: ground-step-front .98s ease-in-out infinite;
}
#stage-svg.shadow-walking #side-shadow {
  animation: ground-step-side 1s ease-in-out infinite;
}
#stage-svg.shadow-jumping #shadow,
#stage-svg.shadow-jumping #side-shadow {
  animation: ground-jump-realistic .75s ease-in-out 3 both;
}
#stage-svg.shadow-dancing #shadow,
#stage-svg.shadow-dancing #side-shadow {
  animation: ground-dance-realistic .45s ease-in-out infinite alternate;
}
@keyframes ground-idle-realistic {
  0%, 100% { transform: scale(1); opacity: .32; }
  50% { transform: scale(.97); opacity: .29; }
}
/* Alternancia de apoyos: variaciones discretas en eje y anchura. */
@keyframes ground-step-front {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-7px) scale(.91,.92); opacity: .30; }
  75% { transform: translateX(7px) scale(.91,.92); opacity: .30; }
}
@keyframes ground-step-side {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-6px) scale(.90,.94); opacity: .29; }
  75% { transform: translateX(6px) scale(.90,.94); opacity: .29; }
}
/* El personaje sube, pero su sombra no: se contrae y pierde intensidad. */
@keyframes ground-jump-realistic {
  0%,100% { transform: scale(1); opacity: .36; }
  42%,58% { transform: scale(.57,.76); opacity: .15; }
}
@keyframes ground-dance-realistic {
  from { transform: translateX(-5px) scale(1); opacity:.34; }
  to { transform: translateX(5px) scale(.91,.89); opacity:.26; }
}
@media(prefers-reduced-motion:reduce) {

}
