<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Michi · revisión de correcciones</title><style>
/* v18 — detailed illustrated and animated avatar family */
.avatar-character{
  display:block;
  overflow:visible;
  transform-origin:center 78%;
}
.avatar-character .avatar-ground{
  fill:rgba(65,52,70,.14);
  filter:blur(1.8px);
}
.avatar-character .avatar-whole{
  transform-box:fill-box;
  transform-origin:center 76%;
}
.animal-avatar-emoji{
  width:232px;
  height:276px;
  display:grid;
  place-items:center;
}
.animal-avatar-emoji .avatar-main-svg{
  width:232px;
  height:276px;
}
.avatar-choice-emoji{
  min-height:59px;
  display:grid;
  place-items:center;
}
.avatar-choice-emoji .avatar-choice-svg{
  width:56px;
  height:66px;
  margin:-7px auto -1px;
  filter:drop-shadow(0 5px 5px rgba(55,42,58,.14));
}
.language-panda svg.avatar-startup-svg{
  width:96px;
  height:112px;
  margin:-20px auto -14px;
  filter:drop-shadow(0 9px 8px rgba(55,42,58,.15));
}
.avatar-character .avatar-eye-white{fill:#fff}
.avatar-character .avatar-iris{fill:#61566b}
.avatar-character .avatar-pupil{fill:#211d25}
.avatar-character .avatar-eye-shine{fill:#fff}
.avatar-character .avatar-cheek{fill:#f49ab3;opacity:.52}
.avatar-character .avatar-brow{
  fill:none;
  stroke:#443b47;
  stroke-width:4.5;
  stroke-linecap:round;
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .22s ease;
}
.avatar-character .avatar-eye-group{
  transform-box:fill-box;
  transform-origin:center;
  animation:detailedAvatarBlink 5.4s ease-in-out infinite;
}
.avatar-character .avatar-tail{
  transform-box:fill-box;
  transform-origin:left center;
  animation:detailedTailSway 2.4s ease-in-out infinite;
}
.avatar-character .avatar-ear{
  transform-box:fill-box;
  transform-origin:center bottom;
  animation:detailedEarTwitch 6.2s ease-in-out infinite;
}
.avatar-character .avatar-ear-right{animation-delay:.12s}
.avatar-character .avatar-mouth{
  transform-box:fill-box;
  transform-origin:center;
  transition:transform .22s ease,stroke .22s ease;
}
.avatar-character .avatar-antenna{animation:moodBadgeFloat 1.7s ease-in-out infinite}
.avatar-character .avatar-wing{transform-box:fill-box;transform-origin:center top}
.avatar-character .avatar-spines{filter:drop-shadow(0 4px 3px rgba(55,42,58,.12))}
.avatar-character .avatar-shell{filter:drop-shadow(0 5px 4px rgba(55,42,58,.12))}
.robotito.avatar-custom.mood-happy .avatar-character .avatar-whole,
.robotito.avatar-custom.mood-affectionate .avatar-character .avatar-whole{
  animation:detailedHappyBounce .72s ease-in-out infinite alternate;
}
.robotito.avatar-custom.mood-sad .avatar-character .avatar-mouth{
  transform:rotate(180deg) translateY(-5px);
}
.robotito.avatar-custom.mood-sad .avatar-character .avatar-brow-left{transform:rotate(12deg)}
.robotito.avatar-custom.mood-sad .avatar-character .avatar-brow-right{transform:rotate(-12deg)}
.robotito.avatar-custom.mood-angry .avatar-character .avatar-brow-left{transform:translateY(5px) rotate(18deg)}
.robotito.avatar-custom.mood-angry .avatar-character .avatar-brow-right{transform:translateY(5px) rotate(-18deg)}
.robotito.avatar-custom.mood-scared .avatar-character .avatar-pupil{
  transform-box:fill-box;
  transform-origin:center;
  animation:detailedScaredEyes .18s ease-in-out infinite alternate;
}
.robotito.avatar-custom.mood-sleepy .avatar-character .avatar-eye-group{
  animation:none;
  transform:scaleY(.12);
}
.robotito.avatar-custom.eating .avatar-character .avatar-mouth{
  animation:detailedNibble .24s ease-in-out infinite alternate;
}
.robotito.avatar-custom.dancing .avatar-character .avatar-wing-left,
.robotito.avatar-custom.dancing .avatar-character .avatar-arm-left{animation:detailedWave .45s ease-in-out infinite alternate}
.robotito.avatar-custom.dancing .avatar-character .avatar-wing-right,
.robotito.avatar-custom.dancing .avatar-character .avatar-arm-right{animation:detailedWave .45s ease-in-out infinite alternate-reverse}
.robotito.avatar-custom.pet-happy .avatar-character .avatar-ear-left{animation:detailedPetEar .42s ease-in-out 3}
.robotito.avatar-custom.pet-happy .avatar-character .avatar-ear-right{animation:detailedPetEar .42s ease-in-out 3 reverse}
.robotito.avatar-custom.heart-eyes .avatar-character .avatar-eye-group,
.robotito.avatar-custom.pet-happy .avatar-character .avatar-eye-group{opacity:.15}
.robotito.avatar-custom.heart-eyes .animal-avatar-heart-eyes,
.robotito.avatar-custom.pet-happy .animal-avatar-heart-eyes{
  top:91px;
  font-size:39px;
  letter-spacing:32px;
  text-indent:32px;
}
.robotito.avatar-chameleon .avatar-character,
.robotito.avatar-iguana .avatar-character{
  filter:hue-rotate(var(--chameleon-hue,var(--iguana-hue,0deg))) saturate(1.12);
  transition:filter .5s ease;
}
.robotito.avatar-robot .avatar-character .avatar-iris{fill:#39a8cc}
.robotito.avatar-robot .avatar-character .avatar-pupil{fill:#173b55}
.robotito.avatar-peacock .avatar-character .avatar-tail-fan{animation:detailedFan 2.3s ease-in-out infinite alternate}
.robotito.avatar-dog.species-reacting .avatar-character .avatar-tail-wag,
.robotito.avatar-fox.species-reacting .avatar-character .avatar-tail,
.robotito.avatar-wolf.species-reacting .avatar-character .avatar-tail{
  animation:detailedFastTail .2s ease-in-out infinite alternate;
}
@keyframes detailedAvatarBlink{
  0%,43%,47%,100%{transform:scaleY(1)}
  45%,46%{transform:scaleY(.08)}
}
@keyframes detailedTailSway{
  0%,100%{transform:rotate(-5deg)}
  50%{transform:rotate(8deg)}
}
@keyframes detailedFastTail{
  from{transform:rotate(-16deg)}
  to{transform:rotate(19deg)}
}
@keyframes detailedEarTwitch{
  0%,82%,100%{transform:rotate(0)}
  86%{transform:rotate(-9deg)}
  90%{transform:rotate(6deg)}
}
@keyframes detailedHappyBounce{
  from{transform:translateY(0) scale(1)}
  to{transform:translateY(-5px) scale(1.018)}
}
@keyframes detailedScaredEyes{
  from{transform:translateX(-2px) scale(1.08)}
  to{transform:translateX(2px) scale(1.08)}
}
@keyframes detailedNibble{
  from{transform:scaleY(.72)}
  to{transform:scaleY(1.18)}
}
@keyframes detailedWave{
  from{transform:rotate(-8deg)}
  to{transform:rotate(14deg)}
}
@keyframes detailedPetEar{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(12deg)}
}
@keyframes detailedFan{
  from{transform:scale(.96)}
  to{transform:scale(1.04)}
}
@media(max-width:620px){
  .animal-avatar-emoji,
  .animal-avatar-emoji .avatar-main-svg{
    width:210px;
    height:250px;
  }
  .avatar-choice-emoji .avatar-choice-svg{
    width:52px;
    height:61px;
  }
}
@media(prefers-reduced-motion:reduce){
  .avatar-character *,
  .avatar-character{animation:none!important}
}

/* P24 — object is carried by the avatar, never placed on a floating card. */
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.robotito.object-trip-walking{transition:left .85s ease-in-out!important}
.robotito.object-trip-searching{opacity:.45;transition:opacity .25s}
.robotito.object-trip-presenting .object-scene-prop{animation:objectInPaw .35s ease-out both}
.object-scene-prop{position:absolute;z-index:22;left:74%;top:60%;transform:translate(-50%,-50%);font-size:clamp(42px,6vw,75px);line-height:1;filter:drop-shadow(0 5px 3px rgba(0,0,0,.18));pointer-events:none}

.robotito:is(.avatar-penguin,.avatar-owl,.avatar-swan,.avatar-parrot) .object-scene-prop{left:69%;top:65%}
@keyframes objectInPaw{from{opacity:0;transform:translate(-50%,-20%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){
  .robotito.object-trip-walking{transition:none!important}

}

/* P28: original approved avatar art fills only the scene, never the input/controls. */
.world-scene{isolation:isolate}

/* P30–P32: touch feedback, non-overlapping blink and emotion transitions. */
.robotito:not(.sleeping){cursor:pointer;touch-action:manipulation}

.robotito.sleep-entering .lid-svg,
.robotito.sleep-entering .lid{transition:transform .6s ease-out}
.robotito.sleep-entering .eye-white-svg,.robotito.sleep-entering .iris{
 transition:opacity .55s ease-out}
.robotito.waking .lid-svg,.robotito.waking .lid{
 transition:transform .55s cubic-bezier(.18,.75,.25,1)}
.robotito.waking .eye-white-svg,.robotito.waking .iris{
 transition:opacity .48s ease-in}
.robotito.mood-embarrassed .cheek-left,
.robotito.mood-embarrassed .cheek-right,

 opacity:.86;filter:saturate(1.13)}
.robotito.mood-angry .brow-left{transform:rotate(16deg) translateY(2px)}
.robotito.mood-angry .brow-right{transform:rotate(-16deg) translateY(2px)}

@media(prefers-reduced-motion:reduce){
 .robotito.sleep-entering .lid-svg,.robotito.sleep-entering .lid,
 .robotito.waking .lid-svg,.robotito.waking .lid,
 .robotito.sleep-entering .eye-white-svg,.robotito.waking .eye-white-svg,
 .robotito.sleep-entering .iris,.robotito.waking .iris{
 transition:none!important;animation:none!important}
}

/* 2026-11-21 · Anatomía integrada + expresiones sin capas duplicadas.
   Cada gesto es mutuamente excluyente y la cabeza de Roji mantiene sus rasgos. */
.robotito.avatar-custom .avatar-character .avatar-upper-eyelids,
.robotito.avatar-custom .avatar-character .avatar-love-eyes,
.robotito.avatar-custom .avatar-character .avatar-excited-eyes,
.robotito.avatar-custom .avatar-character .avatar-closed-eyes,
.robotito.avatar-custom .avatar-character .avatar-tears,
.robotito.avatar-custom .avatar-character .avatar-anger-mark,
.robotito.avatar-custom .avatar-character .avatar-sweat-mark,
.robotito.avatar-custom .avatar-character .avatar-question-mark,
.robotito.avatar-custom .avatar-character .avatar-hunger-cloud,
.robotito.avatar-custom .avatar-character .avatar-speaking-mouth{
  opacity:0;pointer-events:none;
}
.robotito.avatar-custom .avatar-character .avatar-upper-eyelids{transform-box:fill-box;transform-origin:center 32%}
.robotito.avatar-custom.mood-sleepy:not(.sleeping) .avatar-character .avatar-upper-eyelids,
.robotito.avatar-custom.mood-bored:not(.sleeping) .avatar-character .avatar-upper-eyelids{opacity:1}
.robotito.avatar-custom.mood-sleepy:not(.sleeping) .avatar-character .avatar-upper-eyelids{transform:translateY(9px)}
.robotito.avatar-custom.mood-bored:not(.sleeping) .avatar-character .avatar-upper-eyelids{transform:translateY(4px)}
/* Never squash eyes so that a second pupil peeks through the lid. */
.robotito.avatar-custom.mood-sleepy .avatar-character .avatar-eye-group{transform:none}
.robotito.avatar-custom.sleeping .avatar-character .avatar-eye-group{opacity:0!important;visibility:hidden!important;animation:none!important}
.robotito.avatar-custom.sleeping .avatar-character .avatar-upper-eyelids{opacity:0!important}
.robotito.avatar-custom.sleeping .avatar-character .avatar-closed-eyes{opacity:1!important}
.robotito.avatar-custom.sleeping .avatar-character .avatar-speaking-mouth{opacity:0!important}
.robotito.avatar-custom .avatar-character .avatar-closed-eyes{transition:opacity .12s ease}
.robotito.avatar-custom.heart-eyes .avatar-character .avatar-eye-group,
.robotito.avatar-custom.pet-happy .avatar-character .avatar-eye-group{opacity:1}
.robotito.avatar-custom.heart-eyes .animal-avatar-heart-eyes,
.robotito.avatar-custom.pet-happy .animal-avatar-heart-eyes{display:none!important}
.robotito.avatar-custom:is(.heart-eyes,.mood-affectionate):not(.sleeping) .avatar-character .avatar-love-eyes{opacity:1}
.robotito.avatar-custom.mood-excited:not(.sleeping) .avatar-character .avatar-excited-eyes{opacity:1}
.robotito.avatar-custom:is(.heart-eyes,.mood-affectionate,.mood-excited) .avatar-character :is(.avatar-iris,.avatar-pupil,.avatar-eye-shine,.avatar-eye-star){opacity:0}
.robotito.avatar-custom .avatar-character .avatar-love-eyes,
.robotito.avatar-custom .avatar-character .avatar-excited-eyes{transform-box:fill-box;transform-origin:center}
.robotito.avatar-custom.mood-sad:not(.sleeping) .avatar-character .avatar-tears{opacity:1}
.robotito.avatar-custom.mood-sad .avatar-character .avatar-tear-left{animation:customTearFall 1.6s ease-in infinite}

@keyframes customTearFall{
  0%{opacity:0;transform:translateY(-8px) scale(.8)}

  100%{opacity:0;transform:translateY(22px) scale(1.1)}

.robotito.avatar-custom.mood-angry .avatar-character .avatar-anger-mark,

.robotito.avatar-custom.mood-scared .avatar-character .avatar-sweat-mark{opacity:1}

.robotito.avatar-custom.mood-curious .avatar-character .avatar-brow{opacity:1!important;stroke-width:4.2!important}
.robotito.avatar-custom.speaking:not(.sleeping) .avatar-character .avatar-mouth,
.robotito.avatar-custom.speaking:not(.sleeping) .avatar-character .avatar-tongue{opacity:0!important}

</div><section class="controls-panel"><h2>Emociones de Michi</h2><div class="mood-grid" id="moods"></div>
<div class="action-row"><button type="button" id="talk" aria-pressed="false">🗣️ Hablar</button><button type="button" id="blink">😉 Parpadear</button><button type="button" id="hiFive">✋ Chocar los cinco</button></div>
<p class="note">Vista independiente del SVG de Michi en la rama de revisión. No modifica tu avatar seleccionado.</p></section></main>
<script>
(()=>{
 const avatar=document.getElementById("avatar"),group=document.getElementById("moods"),talk=document.getElementById("talk");
 const moods=[["mood-happy","😊 Feliz"],["mood-sad","😢 Triste"],["mood-angry","😠 Enojado"],["mood-scared","😨 Asustado"],["mood-affectionate heart-eyes","😍 Enamorado"],["mood-hungry","🐟 Hambriento"],["mood-sleepy sleeping","💤 Dormido"],["mood-curious","🤔 Curioso"],["mood-confused","❔ Confundido"],["mood-excited","⭐ Emocionado"],["mood-bored","😑 Aburrido"],["mood-sleepy","🥱 Cansado"],["mood-shy","☺️ Tímido"]];
 const allMoodClasses=[...new Set(moods.flatMap(([c])=>c.split(" ")))];
 function choose(c){avatar.classList.remove(...allMoodClasses);avatar.classList.add(...c.split(" "));if(c.includes("sleeping")){avatar.classList.remove("speaking");talk.setAttribute("aria-pressed","false")}
 group.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.classes===c)));}
 for(const [classes,label]of moods){let b=document.createElement("button");b.type="button";b.className="mood-button";b.dataset.classes=classes;b.textContent=label;b.onclick=()=>choose(classes);group.append(b);}
 talk.onclick=()=>{if(avatar.classList.contains("sleeping"))choose("mood-happy");talk.setAttribute("aria-pressed",String(avatar.classList.toggle("speaking")))};
 document.getElementById("blink").onclick=()=>{avatar.classList.add("manual-blink");setTimeout(()=>avatar.classList.remove("manual-blink"),250)};
 document.getElementById("hiFive").onclick=()=>{avatar.classList.remove("poked");void avatar.offsetWidth;avatar.classList.add("poked");setTimeout(()=>avatar.classList.remove("poked"),900)};
 choose("mood-happy");
})();
</script></body></html>
