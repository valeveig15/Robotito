/* ================================================================
   SOMBRAS PROPORCIONALES Y ANIMADAS — VERSION NUEVA
   Separadas del cuerpo: permanecen en el suelo al saltar.
   La sombra lateral sigue el desplazamiento real, sin levitar.
   ================================================================ */
#shadow, #side-shadow {
  transform-box: view-box;
  filter: blur(2.6px);
  transform-origin: 352px 559px;
  animation: ground-idle-realistic 4.2s ease-in-out infinite;
}
#side-shadow-track {
  display: none;
  transform: translateX(0px);
  transition: transform 2.45s linear;
  pointer-events: none;
}
#stage-svg[data-view="perfil"] #side-shadow-track,
#stage-svg[data-view="derecha"] #side-shadow-track { display:block; }
#stage-svg.shadow-walking #shadow {
  animation: ground-step-front .98s ease-in-out infinite;
}
#stage-svg.shadow-walking #side-shadow {
  animation: ground-step-side 1s ease-in-out infinite;
}
#stage-svg.shadow-jumping #shadow,
#stage-svg.shadow-jumping #side-shadow {
  animation: ground-jump-realistic .75s ease-in-out 3 both;
}
#stage-svg.shadow-dancing #shadow,
#stage-svg.shadow-dancing #side-shadow {
  animation: ground-dance-realistic .45s ease-in-out infinite alternate;
}
@keyframes ground-idle-realistic {
  0%, 100% { transform: scale(1); opacity: .32; }
  50% { transform: scale(.97); opacity: .29; }
}
/* Alternancia de apoyos: variaciones discretas en eje y anchura. */
@keyframes ground-step-front {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-7px) scale(.91,.92); opacity: .30; }
  75% { transform: translateX(7px) scale(.91,.92); opacity: .30; }
}
@keyframes ground-step-side {
  0%, 50%, 100% { transform: translateX(0) scale(1); opacity: .36; }
  25% { transform: translateX(-6px) scale(.90,.94); opacity: .29; }
  75% { transform: translateX(6px) scale(.90,.94); opacity: .29; }
}
/* El personaje sube, pero su sombra no: se contrae y pierde intensidad. */
@keyframes ground-jump-realistic {
  0%,100% { transform: scale(1); opacity: .36; }
  42%,58% { transform: scale(.57,.76); opacity: .15; }
}
@keyframes ground-dance-realistic {
  from { transform: translateX(-5px) scale(1); opacity:.34; }
  to { transform: translateX(5px) scale(.91,.89); opacity:.26; }
}

#avatar[data-mood="curioso"] #brows-curious path{stroke-width:6!important}
#avatar.speaking:not([data-mood="triste"]):not([data-mood="enojado"]) #mouth-speak{display:inline!important;opacity:1!important;visibility:visible!important}
#avatar.speaking #mouth-happy,#avatar.speaking #mouth-neutral,
#avatar.speaking #mouth-o,#avatar.speaking #mouth-sad,#avatar.speaking #mouth-angry{opacity:0!important}
#avatar[data-mood="enamorado"] #heart-eyes,#avatar[data-mood="emocionado"] #star-eyes{opacity:1!important}
#avatar[data-mood="enamorado"] #eye-pupils,#avatar[data-mood="emocionado"] #eye-pupils{opacity:0!important}
@media(prefers-reduced-motion:reduce){#avatar[data-mood="triste"] #tears path{animation:none!important}}

.approved-object-prop{position:absolute;left:58%;top:48%;font-size:clamp(24px,5vw,51px);pointer-events:none;filter:drop-shadow(0 5px 5px rgba(40,30,40,.22))}
@media(prefers-reduced-motion:reduce){
 #stage-svg #avatar,#stage-svg #front-view,#stage-svg #side-locomotion{animation:none!important;transition:none!important}
}
</style>
<script>
(()=>{"use strict";
 const stage=document.getElementById("stage-svg");
 const avatar=document.getElementById("avatar");
 if(!stage||!avatar)return;
 stage.setAttribute("preserveAspectRatio","xMidYMid meet");
 const ns="http://www.w3.org/2000/svg";
 const openEyes=avatar.querySelector("#eye-open");
 if(openEyes&&!avatar.querySelector("#approved-eyelids")){
   const lids=document.createElementNS(ns,"g");
   lids.setAttribute("id","approved-eyelids");
   lids.setAttribute("fill","#f8f8f7");
   lids.setAttribute("stroke","#59443f");
   lids.setAttribute("stroke-width","1.8");
   lids.setAttribute("stroke-opacity",".12");
   for(const d of ["M268 241Q268 213 292 211Q315 212 319 241Q293 230 268 241Z","M389 239Q391 213 413 211Q437 213 439 239Q413 228 389 239Z"]){
     const lid=document.createElementNS(ns,"path");
     lid.setAttribute("d",d);lids.appendChild(lid);
   }
   openEyes.after(lids);
 }
 const moods=[["feliz","😊 Feliz"],["tranquilo","😌 Tranquilo"],["triste","😢 Triste"],["enojado","😠 Enojado"],["asustado","😨 Asustado"],
 ["enamorado","😍 Enamorado"],["hambriento","🍎 Hambriento"],["dormido","💤 Dormido"],["curioso","🤔 Curioso"],
 ["confundido","❔ Confundido"],["emocionado","⭐ Emocionado"],["aburrido","😑 Aburrido"],["cansado","🥱 Cansado"],["avergonzado","☺️ Tímido"]];
 const group=document.getElementById("moods");
 function mood(m){
   avatar.dataset.mood=m;
   group.querySelectorAll("button").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.mood===m)));
   if(m==="dormido"){avatar.classList.remove("speaking");talk.setAttribute("aria-pressed","false")}
 }
 for(const [value,label] of moods){
   const btn=document.createElement("button");
   btn.type="button";btn.className="mood-button";btn.dataset.mood=value;btn.textContent=label;
   btn.addEventListener("click",()=>mood(value));group.appendChild(btn);
 }
 const talk=document.getElementById("talk");
 talk.addEventListener("click",()=>{
   if(avatar.dataset.mood==="dormido")mood("tranquilo");
   const active=avatar.classList.toggle("speaking");
   talk.setAttribute("aria-pressed",String(active));
 });
 document.getElementById("blink").addEventListener("click",()=>{
   avatar.classList.remove("blink");void avatar.getBoundingClientRect();avatar.classList.add("blink");
   setTimeout(()=>avatar.classList.remove("blink"),180);
 });
 let side=false;
 document.getElementById("side").addEventListener("click",()=>{
   side=!side;stage.dataset.view=side?"perfil":"frente";
   document.getElementById("side").textContent=side?"↩️ Ver de frente":"↔️ Ver perfil";
 });
 document.getElementById("hiFive").addEventListener("click",()=>{
   avatar.classList.remove("action-chocar");void avatar.getBoundingClientRect();
   avatar.classList.add("action-chocar");
   setTimeout(()=>avatar.classList.remove("action-chocar"),1800);
 });
 mood("feliz");stage.dataset.view="frente";
})();
</script></body></html>
