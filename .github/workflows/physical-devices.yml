name: Robotito physical camera and microphone field smoke

# This workflow never runs on a public runner or on an ordinary pull request.
# It requires a machine voluntarily registered as a self-hosted hardware runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-camera-and-mic:
    runs-on: [self-hosted, linux, robotito-hardware]
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test locally attached physical camera and microphone
        # xvfb supplies a graphical display; it does NOT fake camera/mic data.
        run: xvfb-run -a node tests/p04-physical-device-smoke.js
