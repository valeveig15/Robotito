name: Avatar preview screenshots
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'previews/*.html'
      - '.github/workflows/avatar-preview-screenshots.yml'
permissions:
  contents: write
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Capture actual SVG in browser
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:1100},deviceScaleFactor:1});
            fs.mkdirSync('previews/captures',{recursive:true});
            async function capture(name,file,states){
              await page.goto('file://'+path.resolve('previews/'+file));
              await page.locator('#stage-svg #avatar').waitFor();
              await page.locator('button.btn[data-mood="triste"]').waitFor();
              const frame=page.locator('.stage');
              if(await page.locator('#stage-svg #avatar').count()!==1)throw new Error('Missing true SVG: '+name);
              await frame.screenshot({path:'previews/captures/'+name+'-frente.png',animations:'disabled'});
              await page.screenshot({path:'previews/captures/'+name+'-pagina.png',fullPage:true,animations:'disabled'});
              for(const state of states){
                await page.locator('button.btn[data-mood="'+state+'"]').click();
                await frame.screenshot({path:'previews/captures/'+name+'-'+state+'.png',animations:'disabled'});
              }
            }
            await capture('michi-v21','michi-review.html',['triste','enamorado','dormido','enojado','curioso']);
            await capture('roji-v25','roji-review.html',['triste','enamorado','dormido','confundido']);
            await capture('bobi-v21','bobi-review.html',['triste','enamorado','dormido','curioso']);
            await capture('igui-v10','igui-review.html',['triste','enamorado','dormido','asustado']);
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - name: Save screenshots in same review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/captures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture Michi V21 Roji V2.5 Bobi V21 and Igui V10 in Chromium"
            git fetch origin "${{ github.event.pull_request.head.ref }}"
            git rebase "origin/${{ github.event.pull_request.head.ref }}"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: michi-v21-roji-v25-bobi-v21-igui-v10-capture
          path: previews/captures/*.png
