name: Avatar preview screenshots
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'previews/*.html'
      - '.github/workflows/avatar-preview-screenshots.yml'
permissions:
  contents: write
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Capture actual SVG in browser
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:1100},deviceScaleFactor:1});
            fs.mkdirSync('previews/captures',{recursive:true});
            const preview=path.resolve('previews/michi-review.html');
            await page.goto('file://'+preview);
            await page.locator('#stage-svg #avatar').waitFor();
            await page.locator('[data-mood="triste"].btn').waitFor();
            const frame=page.locator('.stage');
            if(await page.locator('#stage-svg').count()!==1)throw new Error('Original Michi V17 SVG not found');
            await frame.screenshot({path:'previews/captures/michi-v17-frente.png',animations:'disabled'});
            await page.screenshot({path:'previews/captures/michi-v17-pagina.png',fullPage:true,animations:'disabled'});
            await page.locator('button.btn[data-mood="triste"]').click();
            await frame.screenshot({path:'previews/captures/michi-v17-triste.png',animations:'disabled'});
            await page.locator('button.btn[data-mood="enamorado"]').click();
            await frame.screenshot({path:'previews/captures/michi-v17-enamorado.png',animations:'disabled'});
            await page.locator('button.btn[data-mood="dormido"]').click();
            await frame.screenshot({path:'previews/captures/michi-v17-dormido.png',animations:'disabled'});
            await page.locator('button.btn[data-mood="curioso"]').click();
            await frame.screenshot({path:'previews/captures/michi-v17-curioso.png',animations:'disabled'});
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - name: Save screenshots in same review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previews/captures/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Capture authentic Michi V17 HTML in real Chromium"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: michi-v17-chromium-capture
          path: previews/captures/*.png
