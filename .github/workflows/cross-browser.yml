name: Robotito cross-browser media regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-engines:
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install target browser and host libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run media/permission lifecycle in actual browser engine
        env:
          ROBOTITO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: npm run test:p04:browser
