name: Robotito cross-browser app regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'

permissions:
  contents: read

jobs:
  browser-engines:
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBOTITO_BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install target browser and host libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run application UI and fault matrix with three seeds
        run: npm run test:browser:matrix
      - name: Verify dialogue, localization, backup and concurrent storage
        if: ${{ !cancelled() }}
        run: npm run test:browser:extended
      - name: Run media/permission lifecycle in actual browser engine
        if: ${{ !cancelled() }}
        run: npm run test:p04:browser
      - name: Retain coverage, exact failing cases, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.engine }}-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 14
