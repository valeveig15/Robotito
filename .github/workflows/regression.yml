name: Robotito regression suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        # GitHub Ubuntu runners include Chromium's standard shared libraries.
        # Avoid an apt transaction that can stall the whole regression run.
        run: npx playwright install chromium
      - name: Run real YAMNet Worker smoke
        # Run external integration first for quick, actionable diagnostics;
        # every PR still must pass the full regression suite below.
        run: npm run test:audio:real
      - name: Run real continuous sound-evaluation CLI
        # Generated synthetic WAV, no real/private audio files or claims
        # of recognition accuracy. Exercises the full evaluation command.
        run: npm run test:audio:timeline:real
      - name: Verify private sound-corpus recording and manifest exports
        # Fake Chromium microphone and local WAV; no person or private audio.
        run: npm run test:audio:studio
      - name: Verify manual microphone field diagnostic with synthetic hardware
        # Headless fake microphone only; never claims physical hardware passed.
        run: npm run test:audio:device
      - name: Verify actual avatar reaction trial in Chromium without human audio
        run: npm run test:audio:reactions:browser
      - name: Semantic adversarial coverage by language and seeded batch
        run: |
          ROBOTITO_AUDIT_SEED=17 ROBOTITO_AUDIT_BATCH=0 ROBOTITO_AUDIT_CASES=120 npm run test:semantic:audit
          ROBOTITO_AUDIT_SEED=42 ROBOTITO_AUDIT_BATCH=1 ROBOTITO_AUDIT_CASES=120 npm run test:semantic:audit
          ROBOTITO_AUDIT_SEED=99 ROBOTITO_AUDIT_BATCH=2 ROBOTITO_AUDIT_CASES=120 npm run test:semantic:audit
      - name: Run core and browser regressions
        run: npm run test:ci
      - name: Deep reproducible stress matrix (PR, scheduled or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: |
          ROBOTITO_PROP_SCALE=3 npm run test:properties:matrix
          ROBOTITO_TEST_SEED=42 npm run test:browser:scenarios
          ROBOTITO_TEST_SEED=99 npm run test:browser:scenarios
